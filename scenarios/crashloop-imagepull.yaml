      PodScheduled      True
    Events:
      Type     Reason     Age                  From               Message
      ----     ------     ----                 ----               -------
      Normal   Scheduled  18m                  default-scheduler  Successfully assigned default/api-pod-7d9f4b to ip-10-0-1-42
      Normal   Pulling    18m                  kubelet            Pulling image "myregistry.io/api:v2.3.1-SNAPSHOT"
      Warning  Failed     18m                  kubelet            Failed to pull image "myregistry.io/api:v2.3.1-SNAPSHOT": rpc error: code = Unknown desc = failed to pull and unpack image "myregistry.io/api:v2.3.1-SNAPSHOT": failed to resolve reference "myregistry.io/api:v2.3.1-SNAPSHOT": unexpected status code 404 Not Found
      Warning  Failed     18m                  kubelet            Error: ErrImagePull
      Warning  BackOff    17m (x8 over 17m)   kubelet            Back-off pulling image "myregistry.io/api:v2.3.1-SNAPSHOT"
      Warning  Failed     17m (x8 over 17m)   kubelet            Error: ImagePullBackOff
  "logs": |
    Error from server (BadRequest): container "api" in pod "api-pod-7d9f4b" is waiting to start: image can't be pulled
