  "get pods": |
    NAME              READY   STATUS             RESTARTS   AGE
    api-pod-7d9f4b    0/1     CrashLoopBackOff   8          18m
    redis-5b8c9d      1/1     Running            0          2d
  "describe pod": |
    Name:             api-pod-7d9f4b
    Namespace:        default
    Node:             ip-10-0-1-42.us-east-1.compute.internal/10.0.1.42
    Start Time:       Thu, 19 Jun 2026 08:00:00 +0000
    Labels:           app=api
                      version=v2.3.1
    Status:           Running
    IP:               10.244.1.15
    Containers:
      api:
        Image:          myregistry.io/api:v2.3.1-SNAPSHOT
        Image ID:
        Port:           8080/TCP
        Host Port:      0/TCP
        State:          Waiting
          Reason:       CrashLoopBackOff
        Last State:     Terminated
          Reason:       Error
          Exit Code:    1
          Started:      Thu, 19 Jun 2026 08:17:42 +0000
          Finished:     Thu, 19 Jun 2026 08:17:43 +0000
        Ready:          False
        Restart Count:  8
        Limits:
          cpu:     500m
          memory:  256Mi
        Requests:
          cpu:     100m
          memory:  128Mi
    Conditions:
      Type              Status
