apiVersion: v1
kind: Service
metadata:
  name: {{ include "heimdall.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heimdall.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "heimdall.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  type: {{ .Values.service.type }}
