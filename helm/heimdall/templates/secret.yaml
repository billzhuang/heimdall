{{- if and (not .Values.existingSecret.name) .Values.anthropicApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "heimdall.fullname" . }}-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heimdall.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.existingSecret.key | quote }}: {{ .Values.anthropicApiKey | quote }}
{{- end }}
