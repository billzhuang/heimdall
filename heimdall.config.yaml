# Heimdall tool configuration
#
# Set HEIMDALL_CONFIG=/path/to/heimdall.config.yaml to use a custom location.
# All keys are optional — omit a section to use the built-in defaults.

tools:
  # Read-only kubectl execution (core tool — disable only for testing)
  kubectl: true

  # Discover EKS cluster contexts from kubeconfig / in-cluster token
  listContexts: true

  # Enumerate namespaces in a context
  listNamespaces: true

  # Prometheus read-only PromQL queries — disabled by default.
  # Enable when Prometheus is reachable and set prometheus.url below.
  # prometheus_query: true

  # Read-only AWS CLI execution — disabled by default; requires AWS credentials in env.
  # Set to true to enable `aws_cli` tool and AWS specialist subagents (eks-troubleshooter,
  # iam-auditor, aws-resource-analyzer). Also accepted as `aws_cli: true`.
  # awsCli: false

  # Trivy image/IaC vulnerability scanning — disabled by default; requires trivy on PATH.
  # Set to true to enable `trivy_scan` tool and CVE-aware security-auditor behaviour.
  # Also accepted as `trivy_scan: true`.
  # trivyScan: false

# Prometheus HTTP API (required when tools.prometheus_query is enabled).
# prometheus:
#   url: http://prometheus-operated.monitoring:9090
#   timeoutMs: 10000   # optional, default 10000

# Regex-based redaction: strip sensitive patterns from all tool output before the model sees it.
# Disabled by default. Each rule's pattern is a JavaScript regex; matches are replaced
# with [REDACTED:<name>]. Patterns are compiled once at startup.
# redaction:
#   enabled: true
#   rules:
#     - name: aws_access_key
#       pattern: 'AKIA[0-9A-Z]{16}'
#     - name: private_key_pem
#       pattern: '-----BEGIN( RSA| EC| OPENSSH)? PRIVATE KEY-----'
#     - name: generic_token
#       pattern: '(?i)(bearer|token|api[_-]?key)["\s:=]+[A-Za-z0-9/+._-]{20,}'

# Namespace lockdown — restrict the agent to a single namespace (code-enforced).
# When set, every kubectl call is automatically scoped to this namespace;
# -A/--all-namespaces and other namespaces are blocked.
#
# namespace:
#   locked: prod-payments

# Slack notification sink — post investigation findings to a Slack incoming webhook.
# Disabled by default. Enable by setting `enabled: true` and providing the webhook URL.
# The webhook URL can also come from the SLACK_WEBHOOK_URL environment variable.
#
# slack:
#   enabled: true
#   webhookUrl: ${SLACK_WEBHOOK_URL}    # or hard-code the URL (not recommended)
#   channel: '#sre-alerts'              # optional override; uses webhook default when omitted
#   minSeverity: warning                # only post 'warning' and 'critical' findings (default)
#   timeoutMs: 10000                    # optional, default 10000

# Runbook integration — load local markdown playbooks into the system prompt.
# Paths are resolved relative to this config file's directory.
# Untagged runbooks always load; tagged ones load only when their tags match the
# current query (useful when starting heimdall with --prompt).
#
# runbooks:
#   - path: ./runbooks/general.md
#   - path: ./runbooks/api-latency.md
#     tags: [latency, api, response-time]
#   - path: ./runbooks/oom-killed.md
#     tags: [oom, memory, oomkilled]

# Self-learning — persist real investigation history for use with self-improve --reflect.
# Enabled by default: every `heimdall -p "..." --json` appends the prompt and finding
# summary to scenarios/task-history.jsonl (relative to the Heimdall package root).
# Use `--no-learn` on individual invocations to skip logging for that run.
#
# learning:
#   enabled: true
#   file: /path/to/custom/task-history.jsonl   # optional; defaults to scenarios/task-history.jsonl
