# Heimdall tool configuration
#
# Set HEIMDALL_CONFIG=/path/to/heimdall.config.yaml to use a custom location.
# All keys are optional — omit a section to use the built-in defaults.

tools:
  # Read-only kubectl execution (core tool — disable only for testing)
  kubectl: true

  # Discover EKS cluster contexts from kubeconfig / in-cluster token
  listContexts: true

  # Enumerate namespaces in a context
  listNamespaces: true

  # Prometheus read-only PromQL queries — disabled by default.
  # Enable when Prometheus is reachable and set prometheus.url below.
  # prometheus_query: true

  # Read-only AWS CLI execution — disabled by default; requires AWS credentials in env.
  # Set to true to enable `aws_cli` tool and AWS specialist subagents (eks-troubleshooter,
  # iam-auditor, aws-resource-analyzer). Also accepted as `aws_cli: true`.
  # awsCli: false

# Prometheus HTTP API (required when tools.prometheus_query is enabled).
# prometheus:
#   url: http://prometheus-operated.monitoring:9090
#   timeoutMs: 10000   # optional, default 10000

# Regex-based redaction: strip sensitive patterns from all tool output before the model sees it.
# Disabled by default. Each rule's pattern is a JavaScript regex; matches are replaced
# with [REDACTED:<name>]. Patterns are compiled once at startup.
# redaction:
#   enabled: true
#   rules:
#     - name: aws_access_key
#       pattern: 'AKIA[0-9A-Z]{16}'
#     - name: private_key_pem
#       pattern: '-----BEGIN( RSA| EC| OPENSSH)? PRIVATE KEY-----'
#     - name: generic_token
#       pattern: '(?i)(bearer|token|api[_-]?key)["\s:=]+[A-Za-z0-9/+._-]{20,}'
