# Single-namespace RBAC variant: self-contained Role + RoleBinding.
#
# Use this INSTEAD OF rbac.yaml when you want to restrict Heimdall's visibility
# to a specific namespace.  This file is self-contained — do NOT also apply
# rbac.yaml (which creates a cluster-wide ClusterRoleBinding that would grant
# access to the whole cluster, defeating the isolation goal).
#
# Before applying, edit the two `namespace: heimdall-target` fields below to
# the namespace you want Heimdall to inspect.
#
# NOTE: This does NOT cover cluster-scoped resources (Nodes, PersistentVolumes,
# ClusterRoles, StorageClasses, etc.).  For full cluster-wide visibility use
# rbac.yaml instead.
#
# Apply:
#   kubectl apply -f deploy/rbac-namespaced.yaml   # self-contained; do NOT apply rbac.yaml first

apiVersion: v1
kind: Namespace
metadata:
  name: heimdall
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: heimdall
  namespace: heimdall
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: heimdall-readonly
  namespace: heimdall-target    # <-- change to the namespace to inspect
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - limitranges
      - persistentvolumeclaims
      - pods
      - pods/log
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - rolebindings
      - roles
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: heimdall-readonly
  namespace: heimdall-target    # <-- change to the namespace to inspect
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: heimdall-readonly
subjects:
  - kind: ServiceAccount
    name: heimdall
    namespace: heimdall
