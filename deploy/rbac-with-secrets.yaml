# Opt-in Secret read access for Heimdall.
#
# Grants the heimdall ServiceAccount read access to Secrets — needed when you
# want Heimdall to inspect Helm release metadata (stored in Secrets) or
# image-pull secrets.  Apply in addition to rbac.yaml:
#
#   kubectl apply -f deploy/rbac.yaml -f deploy/rbac-with-secrets.yaml
#
# WARNING: This gives Heimdall (and therefore the AI model) read access to all
# Secrets in the cluster.  Only apply if you trust the model with secret values
# and understand the data-exfiltration risk.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: heimdall-readonly-with-secrets
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: heimdall-readonly-with-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: heimdall-readonly-with-secrets
subjects:
  - kind: ServiceAccount
    name: heimdall
    namespace: heimdall
