name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Check author permissions
        id: check_permissions
        run: |
          # Get the author association from the event
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            AUTHOR_ASSOCIATION="${{ github.event.comment.author_association }}"
          elif [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            AUTHOR_ASSOCIATION="${{ github.event.comment.author_association }}"
          elif [ "${{ github.event_name }}" = "pull_request_review" ]; then
            AUTHOR_ASSOCIATION="${{ github.event.review.author_association }}"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            AUTHOR_ASSOCIATION="${{ github.event.issue.author_association }}"
          else
            AUTHOR_ASSOCIATION="NONE"
          fi

          echo "Author association: $AUTHOR_ASSOCIATION"

          # Only allow trusted users: OWNER, MEMBER, COLLABORATOR
          # Reject: CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR, FIRST_TIMER, NONE
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "✅ User is authorized to trigger Claude"
              echo "authorized=true" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "❌ User is not authorized to trigger Claude (author_association: $AUTHOR_ASSOCIATION)"
              echo "Only repository owners, members, and collaborators can trigger @claude"
              echo "authorized=false" >> $GITHUB_OUTPUT
              exit 1
              ;;
          esac

      - name: Checkout repository
        if: steps.check_permissions.outputs.authorized == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        if: steps.check_permissions.outputs.authorized == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'

